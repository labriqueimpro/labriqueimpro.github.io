<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation gratuite - La Brique Impro</title>

<style>

:root{
    --bleu:#6F8F95;
    --orange:#E66A1B;
    --bleu-fonce:#175C7D;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
}

.container{
    width:100%;
    max-width:850px;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

/* ---------- HERO ---------- */

.hero{
    padding:25px;
    text-align:center;
    background:white;
}

.badge{
    display:inline-block;
    background:var(--orange);
    color:white;
    font-weight:bold;
    padding:8px 18px;
    border-radius:30px;
    margin-bottom:15px;
    font-size:.85rem;
}

.hero h1{
    color:var(--bleu-fonce);
    font-size:2rem;
    margin-bottom:10px;
}

.hero p{
    color:#666;
    line-height:1.5;
    margin-bottom:20px;
}

/* ---------- FORM ---------- */

.formulaire{
    display:grid;
    gap:10px;
    max-width:500px;
    margin:auto;
}

input{
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:var(--bleu);
}

#generer{
    padding:16px;
    border:none;
    border-radius:10px;
    background:var(--orange);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

#generer:hover{
    opacity:.92;
}

#generer:disabled{
    background:#bbb;
    cursor:not-allowed;
}

/* ---------- APERCU BILLET ---------- */

.ticket{
    background:#f7f7f7;
    border-top:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px;
}

.qr{
    width:120px;
    height:120px;
    background:white;
    border-radius:10px;
    padding:8px;
    object-fit:contain;
}

.ticket-content{
    flex:1;
}

.ticket-content h2{
    color:var(--bleu-fonce);
    margin-bottom:10px;
}

.ticket-content p{
    margin:4px 0;
    color:#444;
}

.numero{
    color:var(--orange);
    font-weight:bold;
}

.gratuit{
    color:green;
    font-weight:bold;
}

.ticket-number{
    margin-top:10px;
    color:var(--orange);
    font-weight:bold;
}

.print{
    text-align:center;
    padding:15px 20px 25px;
}

.print button{
    background:var(--bleu-fonce);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

/* ---------- MOBILE ---------- */

@media(max-width:700px){

    body{
        align-items:flex-start;
    }

    .hero{
        padding:20px;
    }

    .hero h1{
        font-size:1.6rem;
    }

    .ticket{
        flex-direction:column;
        text-align:center;
    }

    .qr{
        width:110px;
        height:110px;
    }
}

/* ---------- IMPRESSION ---------- */

@media print{

    body{
        background:white;
        padding:0;
    }

    .formulaire,
    .print{
        display:none;
    }

    .container{
        box-shadow:none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">

        <div class="badge">
            🎭 INVITATION GRATUITE
        </div>

        <h1>
            Recevez votre billet en moins de 10 secondes
        </h1>

        <p>
            Complétez vos informations pour obtenir immédiatement
            votre invitation gratuite au spectacle d'improvisation.
        </p>

        <div class="formulaire">

            <input
                id="nom"
                type="text"
                placeholder="Nom">

            <input
                id="prenom"
                type="text"
                placeholder="Prénom">

            <input
                id="email"
                type="email"
                placeholder="Email">

            <button id="generer">
                🎟️ CRÉER
