<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Invitation La Brique Impro</title>

<style>
:root{
  --bleu:#6F8F95;
  --orange:#E66A1B;
  --fonce:#175C7D;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#ececec;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
}

.ticket{
  width:100%;
  max-width:850px;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  display:grid;
  grid-template-columns:2fr 1fr;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.main{
  padding:20px;
}

.side{
  background:var(--fonce);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.badge{
  display:inline-block;
  background:var(--orange);
  color:#fff;
  padding:6px 12px;
  border-radius:20px;
  font-size:.8rem;
  font-weight:bold;
  margin-bottom:10px;
}

h1{
  color:var(--bleu);
  font-size:2rem;
  line-height:1.1;
  margin-bottom:10px;
}

.subtitle{
  margin-bottom:15px;
}

.info{
  font-size:.95rem;
  line-height:1.8;
  margin:15px 0;
}

.highlight{
  color:var(--orange);
  font-weight:bold;
}

.price{
  margin-top:15px;
  font-weight:bold;
}

.free{
  color:green;
}

.qr{
  width:140px;
  height:140px;
  border-radius:8px;
  background:white;
  padding:8px;
}

.ticket-number{
  margin-top:10px;
  text-align:center;
  font-size:.9rem;
  font-weight:bold;
}

.formulaire{
  margin-top:20px;
  display:grid;
  gap:8px;
}

input{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--orange);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:768px){

  body{
    padding:8px;
    align-items:flex-start;
  }

  .ticket{
    grid-template-columns:1fr;
  }

  .side{
    order:-1;
    padding:15px;
  }

  .qr{
    width:120px;
    height:120px;
  }

  h1{
    font-size:1.5rem;
  }

  .main{
    padding:15px;
  }
}

@media print{

  body{
    background:white;
    padding:0;
  }

  .formulaire,
  .print-btn{
    display:none;
  }

  .ticket{
    box-shadow:none;
    width:100%;
    max-width:none;
  }
}
</style>
</head>

<body>

<div class="ticket">

  <div class="main">

    <div class="badge">INVITATION GRATUITE</div>

    <h1>L'Histoire qui n'existe pas encore</h1>

    <p class="subtitle">
      Une pièce improvisée à partir des idées du public.
    </p>

    <div class="info">
      📅 04 septembre 2026<br>
      🕗 20h00<br>
      📍 Le Cercle - Masevaux<br>
      🎟️ 1 personne
    </div>

    <p>Nom : <strong id="nomTicket">À compléter</strong></p>

    <p>
      Billet :
      <strong id="numeroTicket">En attente</strong>
    </p>

    <div class="price">
      Valeur : 10 € •
      <span class="free">À régler : 0 €</span>
    </div>

    <p style="margin-top:10px">
      Offert par
      <span class="highlight">LA BRIQUE IMPRO</span>
    </p>

    <div class="formulaire">

      <input id="nom" placeholder="Nom">

      <input id="prenom" placeholder="Prénom">

      <input id="email" type="email" placeholder="Email">

      <button id="generer">
        Créer mon invitation
      </button>

    </div>

  </div>

  <div class="side">

    <img id="qrCode" class="qr">

    <div id="numeroSide" class="ticket-number">
      Billet non généré
    </div>

  </div>

</div>

</body>
</html>
