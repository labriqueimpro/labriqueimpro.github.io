<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Gratuite - La Brique Impro</title>

<style>

:root{
    --bleu:#6F8F95;
    --orange:#E66A1B;
    --bleu-fonce:#175C7D;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.hero{
    padding:25px;
    text-align:center;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    background:var(--orange);
    color:white;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:15px;
}

.hero h1{
    color:var(--bleu-fonce);
    margin-bottom:10px;
    font-size:2rem;
}

.hero p{
    color:#666;
    margin-bottom:20px;
}

.formulaire{
    max-width:500px;
    margin:auto;
    display:grid;
    gap:12px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    border:none;
    border-radius:10px;
    padding:15px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

#generer{
    background:var(--orange);
    color:white;
}

#generer:disabled{
    background:#ccc;
}

.ticket{
    display:flex;
    gap:20px;
    align-items:center;
    border-top:1px solid #e5e5e5;
    background:#f8f8f8;
    padding:20px;
}

.qr{
    width:140px;
    height:140px;
    background:white;
    border-radius:12px;
    padding:8px;
}

.ticket-content{
    flex:1;
}

.ticket-content h2{
    color:var(--bleu-fonce);
    margin-bottom:10px;
}

.ticket-content p{
    margin:6px 0;
}

.numero{
    color:var(--orange);
    font-weight:bold;
}

.gratuit{
    color:green;
    font-weight:bold;
}

.ticket-number{
    margin-top:10px;
    color:var(--orange);
    font-weight:bold;
}

.print{
    text-align:center;
    padding:20px;
}

.print button{
    background:var(--bleu-fonce);
    color:white;
}

@media(max-width:700px){

    .ticket{
        flex-direction:column;
        text-align:center;
    }

    .hero h1{
        font-size:1.6rem;
    }

    .qr{
        width:120px;
        height:120px;
    }
}

@media print{

    body{
        background:white;
    }

    .formulaire,
    .print{
        display:none;
    }

    .container{
        box-shadow:none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">

        <div class="badge">
            🎭 INVITATION GRATUITE
        </div>

        <h1>Recevez votre billet en moins de 10 secondes</h1>

        <p>
            Complétez vos informations pour obtenir immédiatement
            votre invitation pour le spectacle.
        </p>

        <div class="formulaire">

            <input
